[package]
name = "finload"
version = "0.1.1"
description = "Finload desktop shell"
authors = ["Finload contributors"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/asavage7/finload"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "finload_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png is not a default feature, and is what lets the window icon be built
# from the bundled PNG at runtime (see lib.rs). Without a runtime icon the
# titlebar falls back to a generic one, even though the taskbar resolves the
# right icon through the .desktop file.
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Pinned to wry's versions so types unify. Used to cap the WebKitGTK resource
# cache and configure its memory-pressure handler (see lib.rs). `v2_34` enables
# WebsiteDataManager::set_memory_pressure_settings (needs WebKitGTK >= 2.34).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_34"] }
gtk = "=0.18"
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
souvlaki = "0.8.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

