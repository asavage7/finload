name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pin to Ubuntu 24.04 to confirm minimum support
jobs:
  frontend:
    name: Frontend (check + build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # run svelte-check and vite build
      - run: npm run check
      - run: npm run build

  backend:
    name: Backend (deps + import)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src-backend/requirements.txt

      # Import smoke test for MPV
      - name: Install libmpv
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv2

      - run: pip install -r src-backend/requirements.txt

      - name: Byte-compile every module
        run: python -m compileall -q src-backend

      # Check that all imports work correctly
      - name: Import the app
        working-directory: src-backend
        env:
          FINLOAD_DATA_DIR: ${{ runner.temp }}/finload-data
        run: python -c "import main; assert main.app is not None; print('app imported OK')"

  rust:
    name: Rust (fmt + clippy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libmpv-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tests without building the backend for CI
      - name: Stub the backend executable
        run: |
          mkdir -p src-tauri/binaries/backend
          touch src-tauri/binaries/backend/python-backend
          chmod +x src-tauri/binaries/backend/python-backend

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: clippy
        working-directory: src-tauri
        env:
          SKIP_PYINSTALLER: "1"
        run: cargo clippy --all-targets -- -D warnings

  rust-windows:
    name: Rust (Windows build check)
    # Catches breakage in the target_os = "windows" cfg paths (SMTC hwnd
    # handoff in lib.rs, the mpv-dll lookup in build.rs, etc.) on every push,
    # without paying for a full backend/bundle build -- the release workflow
    # is what actually exercises those.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stub the backend executable
        run: |
          mkdir src-tauri\binaries\backend
          New-Item -ItemType File -Path src-tauri\binaries\backend\python-backend.exe | Out-Null

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: clippy
        working-directory: src-tauri
        env:
          SKIP_PYINSTALLER: "1"
        run: cargo clippy --all-targets -- -D warnings
